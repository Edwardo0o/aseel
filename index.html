<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6E1F35">
<title>Aseel Babekir</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; background:#FDF6F3; color:#2B2B2B; padding-bottom:86px; }
  header { background: linear-gradient(135deg,#6E1F35,#571829); color:#fff; padding:18px 20px 14px; }
  header h1 { margin:0; font-size:27px; }
  header .sub { color:#E9C46A; font-size:15px; margin-top:2px; }
  header .sum { color:#F3D9DE; font-size:15px; margin-top:5px; }
  .page { display:none; padding:14px; }
  .page.active { display:block; }
  .card { background:#fff; border:1px solid #EAD9D3; border-radius:18px; padding:18px; }
  label { display:block; font-weight:bold; font-size:19px; margin:16px 0 7px; }
  label:first-child { margin-top:2px; }
  input, textarea { width:100%; font-size:20px; padding:14px; border:1px solid #EAD9D3; border-radius:12px; background:#FFFBF9; font-family:inherit; }
  .fieldrow { display:flex; gap:8px; }
  .fieldrow input { flex:1; }
  .mic { width:66px; font-size:22px; border:none; border-radius:12px; background:#FBEED3; }
  .save { width:100%; margin-top:22px; padding:17px; font-size:20px; font-weight:bold; color:#fff; border:none; border-radius:36px; background:linear-gradient(135deg,#6E1F35,#571829); }
  .row { display:flex; gap:10px; align-items:center; background:#fff; border:1px solid #EAD9D3; border-radius:16px; padding:14px 16px; margin-bottom:10px; }
  .row .txt { flex:1; }
  .row .name { font-weight:bold; font-size:20px; }
  .row .sub2 { color:#8A7B76; font-size:15px; margin-top:3px; line-height:1.6; }
  .pill { background:#FBEED3; color:#6E1F35; font-weight:bold; font-size:18px; border-radius:12px; padding:8px 12px; text-align:center; white-space:pre-line; }
  nav { position:fixed; bottom:0; right:0; left:0; background:#fff; display:flex; gap:4px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -2px 10px rgba(0,0,0,.08); }
  nav button { flex:1; padding:13px 4px; font-size:17px; font-weight:bold; border:none; border-radius:32px; background:transparent; color:#8A7B76; font-family:inherit; }
  nav button.on { background:#6E1F35; color:#fff; }
  .logo { width:170px; height:170px; border-radius:50%; border:3px solid #C9A227; display:block; margin:8px auto 6px; background:#fff; }
  .brand { text-align:center; font-size:28px; font-weight:bold; color:#6E1F35; }
  .brandsub { text-align:center; color:#C9A227; font-size:14px; letter-spacing:2px; }
  .stats { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .stat { flex:1; min-width:100px; background:#fff; border:1px solid #EAD9D3; border-radius:16px; padding:13px 15px; }
  .stat .cap { color:#8A7B76; font-size:14px; }
  .stat .val { color:#6E1F35; font-weight:bold; font-size:23px; margin-top:2px; }
  .next { text-align:center; font-size:17px; margin-top:16px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:22px; }
  .modal.open { display:flex; }
  .mbox { background:#fff; border-radius:18px; padding:20px; width:100%; max-width:420px; line-height:2; font-size:17px; }
  .mbox h3 { margin:0 0 8px; }
  .mbox button { width:100%; padding:13px; font-size:17px; border:none; border-radius:12px; margin-top:10px; font-family:inherit; }
  .del { background:#B3261E; color:#fff; }
  .close { background:#EEE; }
  .empty { text-align:center; color:#8A7B76; font-size:17px; padding:36px 0; }
</style>
</head>
<body>
<header>
  <h1>💄 Aseel Babekir</h1>
  <div class="sub">Makeup Artist • تسجيل الحجوزات</div>
  <div class="sum" id="hdrSum"></div>
</header>

<div class="page active" id="p-form">
  <div class="card">
    <label>العروس</label>
    <div class="fieldrow"><input id="f-name" placeholder="اسم العروس"><button class="mic" onclick="voice('f-name')">🎤</button></div>
    <label>تاريخ الحجز</label>
    <input type="date" id="f-bd">
    <label>يوم المناسبة</label>
    <input type="date" id="f-td">
    <label>المبلغ (جنيه مصري)</label>
    <input type="number" inputmode="decimal" id="f-amount" placeholder="0">
    <label>ملاحظات</label>
    <div class="fieldrow"><input id="f-notes" placeholder="أي ملاحظات"><button class="mic" onclick="voice('f-notes')">🎤</button></div>
    <button class="save" onclick="saveBooking()">✔ حفظ الحجز</button>
  </div>
</div>

<div class="page" id="p-list"><div id="list"></div></div>

function render() {
  var d = load(), total = 0, next = null, today = todaySlash();
  var html = '';
  d.forEach(function(b) {
    total += Number(b.amount) || 0;
    var sub = 'حجز: ' + esc(b.bd) + (b.td ? ' • المناسبة: ' + esc(b.td) : '') + (b.notes ? ' • ' + esc(b.notes) : '');
    html += '<div class="row" onclick="details(' + b.id + ')"><div class="txt"><div class="name">' + b.id + ') ' + esc(b.name) + '</div><div class="sub2">' + sub + '</div></div><div class="pill">' + fmtNum(b.amount) + '\nجنيه</div></div>';
    if (b.td && b.td >= today && (next === null || b.td < next.td)) next = b;
  });
  document.getElementById('list').innerHTML = html || '<div class="empty">لا توجد حجوزات بعد</div>';
  document.getElementById('hdrSum').textContent = 'عدد الحجوزات: ' + d.length + ' • الإجمالي: ' + fmtNum(total) + ' جنيه';
  document.getElementById('s-count').textContent = d.length;
  document.getElementById('s-total').textContent = fmtNum(total) + ' جنيه';
  document.getElementById('s-next').textContent = next ? ('💍 أقرب مناسبة: ' + next.name + ' — ' + next.td) : 'لا توجد مناسبات قادمة مسجلة';
}

function saveBooking() {
  var name = document.getElementById('f-name').value.trim();
  if (!name) { alert('اكتب اسم العروس الأول'); return; }
  var bd = document.getElementById('f-bd').value, td = document.getElementById('f-td').value;
  var d = load();
  var id = d.reduce(function(m, b){ return Math.max(m, b.id); }, 0) + 1;
  d.push({ id:id, name:name, bd: bd ? disp(bd) : todaySlash(), td: td ? disp(td) : '',
           amount: parseFloat(document.getElementById('f-amount').value) || 0,
           notes: document.getElementById('f-notes').value.trim() });
  store(d);
  document.getElementById('f-name').value = ''; document.getElementById('f-amount').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-td').value = '';
  alert('اتحفظ الحجز ✔');
  showPage(1);
}

function details(id) {
  var b = load().filter(function(x){ return x.id === id; })[0];
  if (!b) return;
  document.getElementById('mbox').innerHTML =
    '<h3>حجز رقم ' + b.id + '</h3>' +
    'العروس: ' + esc(b.name) + '<br>تاريخ الحجز: ' + esc(b.bd) + '<br>يوم المناسبة: ' + esc(b.td || '—') +
    '<br>المبلغ: ' + fmtNum(b.amount) + ' جنيه<br>ملاحظات: ' + esc(b.notes || '—') +
    '<button class="del" onclick="delBooking(' + b.id + ')">حذف الحجز</button>' +
    '<button class="close" onclick="closeModal()">إغلاق</button>';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function delBooking(id) {
  var d = load().filter(function(x){ return x.id !== id; });
  store(d); closeModal(); render();
}

function voice(target) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('الإدخال الصوتي مش مدعوم في المتصفح ده'); return; }
  var r = new SR(); r.lang = 'ar-EG';
  r.onresult = function(e) { document.getElementById(target).value = e.results[0][0].transcript; };
  r.start();
}

(function init() {
  var t = new Date(); function p(n){return (n<10?'0':'')+n;}
  document.getElementById('f-bd').value = t.getFullYear() + '-' + p(t.getMonth()+1) + '-' + p(t.getDate());
  render();
})();
</script>
</body>
